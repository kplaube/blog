{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}
  {{ page.html|safe }}

  {% if page.tags %}
  <ul>
    {% for tag in page.tags %}
      <li><a href="{{ url_for('tag', slug=tag) }}">{{ tag }}</a></li>
    {% endfor %}
  </ul>
  {% endif %}
{% endblock %}
